<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ZESKA OS</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ======= VARIABLES ======= */
:root {
  --bg: #030308;
  --surface: rgba(255,255,255,0.04);
  --surface2: rgba(255,255,255,0.07);
  --border: rgba(255,255,255,0.10);
  --border-bright: rgba(0,210,255,0.4);
  --text: #f0f0ff;
  --dim: #6b6b88;
  --accent: #00d2ff;
  --accent2: #7b2fff;
  --accent3: #ff2f8e;
  --radius: 16px;
  --blur: 20px;
  --font-display: 'Syne', sans-serif;
  --font-mono: 'Space Mono', monospace;
  --glow: 0 0 20px rgba(0,210,255,0.4);
}
body.light {
  --bg: #f0f0f8;
  --surface: rgba(0,0,0,0.04);
  --surface2: rgba(0,0,0,0.07);
  --border: rgba(0,0,0,0.10);
  --text: #0a0a1a;
  --dim: #7070a0;
}

/* ======= RESET & BASE ======= */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-display);
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  min-height: 100vh;
}

/* ======= ANIMATED BG ======= */
#bg-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* ======= NOISE OVERLAY ======= */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity: 0.35;
  pointer-events: none;
  z-index: 1;
}

.wrap { position: relative; z-index: 2; padding: 20px; max-width: 1400px; margin: 0 auto; }

/* ======= HEADER ======= */
header {
  position: sticky;
  top: 12px;
  z-index: 100;
  margin: 12px;
  padding: 14px 28px;
  background: rgba(3,3,8,0.7);
  border: 1px solid var(--border);
  border-radius: 50px;
  backdrop-filter: blur(var(--blur));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  animation: slideDown .6s cubic-bezier(.16,1,.3,1) both;
}

@keyframes slideDown {
  from { opacity:0; transform:translateY(-20px); }
  to { opacity:1; transform:translateY(0); }
}

.brand {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  white-space: nowrap;
}

.brand span {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--dim);
  -webkit-text-fill-color: var(--dim);
  margin-left: 8px;
  vertical-align: middle;
}

nav { display: flex; gap: 4px; }
nav a {
  padding: 7px 14px;
  border-radius: 50px;
  text-decoration: none;
  color: var(--dim);
  font-size: 13px;
  font-weight: 600;
  transition: all .25s;
}
nav a:hover {
  color: var(--text);
  background: var(--surface2);
}
nav a.active {
  color: var(--accent);
  background: rgba(0,210,255,0.1);
}

.header-right { display: flex; gap: 8px; align-items: center; }

.icon-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  transition: all .25s;
}
.icon-btn:hover {
  border-color: var(--accent);
  box-shadow: var(--glow);
  transform: scale(1.08);
}

/* ======= HERO ======= */
.hero {
  padding: 60px 20px 40px;
  text-align: center;
  animation: fadeUp .8s .2s cubic-bezier(.16,1,.3,1) both;
}
.hero-title {
  font-size: clamp(3rem, 8vw, 7rem);
  font-weight: 800;
  line-height: .95;
  letter-spacing: -2px;
}
.hero-title .line1 { display: block; }
.hero-title .gradient-text {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 50%, var(--accent3) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-size: 200% 200%;
  animation: gradientShift 4s ease infinite;
}
@keyframes gradientShift {
  0%,100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.hero-sub {
  margin-top: 16px;
  color: var(--dim);
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: 2px;
}

/* ======= STATS BAR ======= */
.stats-bar {
  display: flex;
  gap: 1px;
  background: var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin: 24px 0;
  animation: fadeUp .8s .3s both;
}
.stat {
  flex: 1;
  padding: 18px 20px;
  background: var(--surface);
  text-align: center;
  transition: background .25s;
}
.stat:hover { background: var(--surface2); }
.stat-num {
  font-size: 28px;
  font-weight: 800;
  font-family: var(--font-mono);
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.stat-label { font-size: 11px; color: var(--dim); margin-top: 4px; letter-spacing: 1px; }

/* ======= SECTION HEADERS ======= */
.section-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 40px 0 16px;
}
.section-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 3px;
  color: var(--dim);
  text-transform: uppercase;
}
.section-line {
  flex: 1;
  height: 1px;
  background: var(--border);
}
.section-badge {
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 4px;
  background: var(--surface2);
  color: var(--dim);
  border: 1px solid var(--border);
}

/* ======= GRID ======= */
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }

/* ======= ITEM CARD ======= */
.item {
  position: relative;
  padding: 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all .3s cubic-bezier(.34,1.56,.64,1);
  overflow: hidden;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
}
.item::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  opacity: 0;
  transition: opacity .3s;
}
.item:hover {
  transform: translateY(-4px) scale(1.02);
  border-color: var(--accent);
  box-shadow: 0 8px 30px rgba(0,210,255,0.15);
}
.item:hover::before { opacity: 0.06; }
.item span { position: relative; z-index: 1; }

.item-icon {
  display: block;
  font-size: 28px;
  margin-bottom: 8px;
}

/* ======= GLOW ITEM ======= */
.glow {
  border-color: var(--accent) !important;
  box-shadow: 0 0 20px rgba(0,210,255,0.3), inset 0 0 20px rgba(0,210,255,0.05);
  animation: glowPulse 2s ease-in-out infinite;
}
@keyframes glowPulse {
  0%,100% { box-shadow: 0 0 20px rgba(0,210,255,0.3), inset 0 0 20px rgba(0,210,255,0.05); }
  50% { box-shadow: 0 0 40px rgba(0,210,255,0.5), inset 0 0 30px rgba(0,210,255,0.1); }
}

/* ======= PORTFOLIO CARD ======= */
.port-card {
  position: relative;
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  border: 1px solid var(--border);
  transition: all .4s cubic-bezier(.34,1.56,.64,1);
  background: var(--surface);
  aspect-ratio: 16/10;
}
.port-card:hover {
  transform: translateY(-6px) scale(1.01);
  border-color: var(--accent);
  box-shadow: 0 20px 50px rgba(0,0,0,.5);
}
.port-card img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform .5s ease;
  filter: saturate(.8) brightness(.7);
}
.port-card:hover img {
  transform: scale(1.06);
  filter: saturate(1.1) brightness(.85);
}
.port-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(3,3,8,.95) 0%, transparent 60%);
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}
.port-tag {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--accent);
  margin-bottom: 6px;
}
.port-title { font-size: 18px; font-weight: 800; }
.port-desc { font-size: 12px; color: var(--dim); margin-top: 4px; }
.port-arrow {
  position: absolute;
  top: 16px; right: 16px;
  width: 36px; height: 36px;
  border-radius: 50%;
  background: rgba(0,210,255,0.15);
  border: 1px solid rgba(0,210,255,0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  opacity: 0;
  transform: scale(.7);
  transition: all .3s;
}
.port-card:hover .port-arrow { opacity: 1; transform: scale(1); }

/* ======= TEAM CARD ======= */
.team-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 24px 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: all .3s;
  cursor: default;
}
.team-card:hover {
  border-color: var(--accent2);
  transform: translateY(-4px);
  box-shadow: 0 10px 30px rgba(123,47,255,0.15);
}
.avatar {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  font-weight: 800;
  color: #fff;
  border: 2px solid rgba(255,255,255,0.1);
}
.team-name { font-weight: 700; font-size: 15px; }
.team-role {
  font-size: 11px;
  color: var(--dim);
  font-family: var(--font-mono);
  letter-spacing: 1px;
  padding: 3px 10px;
  background: var(--surface2);
  border-radius: 50px;
}

/* ======= CONTACT SECTION ======= */
.contact-bar {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
}
.contact-item {
  flex: 1;
  min-width: 200px;
  padding: 20px 24px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: all .3s;
  text-decoration: none;
  color: var(--text);
}
.contact-item:hover {
  border-color: var(--accent3);
  box-shadow: 0 8px 24px rgba(255,47,142,0.12);
  transform: translateY(-3px);
}
.contact-icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent3), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.contact-label { font-size: 12px; color: var(--dim); }
.contact-value { font-weight: 700; font-size: 15px; }

/* ======= DOCK ======= */
.dock {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  background: rgba(3,3,8,0.85);
  border: 1px solid var(--border);
  border-radius: 50px;
  backdrop-filter: blur(var(--blur));
  z-index: 50;
  box-shadow: 0 10px 40px rgba(0,0,0,.5);
  animation: slideUp .6s .5s cubic-bezier(.16,1,.3,1) both;
}
@keyframes slideUp {
  from { opacity:0; transform:translateX(-50%) translateY(20px); }
  to { opacity:1; transform:translateX(-50%) translateY(0); }
}
.dock-item {
  padding: 9px 16px;
  border-radius: 50px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
  color: var(--dim);
  transition: all .25s;
  white-space: nowrap;
  letter-spacing: .5px;
}
.dock-item:hover {
  color: var(--text);
  background: var(--surface2);
  transform: translateY(-4px) scale(1.05);
}
.dock-item.glow-dock {
  color: var(--accent);
  background: rgba(0,210,255,0.1);
  border: 1px solid rgba(0,210,255,0.3);
}

/* ======= TERMINAL WIDGET ======= */
.terminal {
  background: #000;
  border: 1px solid #1a1a2e;
  border-radius: var(--radius);
  overflow: hidden;
  font-family: var(--font-mono);
  font-size: 13px;
  margin-bottom: 14px;
}
.terminal-bar {
  padding: 10px 16px;
  background: #0d0d1a;
  display: flex;
  align-items: center;
  gap: 8px;
}
.t-dot { width: 12px; height: 12px; border-radius: 50%; }
.t-dot.r { background: #ff5f57; }
.t-dot.y { background: #ffbd2e; }
.t-dot.g { background: #28ca41; }
.terminal-title { margin-left: 8px; color: #555; font-size: 11px; }
.terminal-body { padding: 16px; min-height: 80px; }
.t-line { margin: 4px 0; color: #888; }
.t-line .prompt { color: var(--accent); }
.t-line .cmd { color: #fff; }
.t-line .output { color: #55ff88; }
.t-line .err { color: #ff5f57; }
.cursor {
  display: inline-block;
  width: 8px; height: 14px;
  background: var(--accent);
  vertical-align: middle;
  animation: blink .8s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* ======= SEARCH BAR ======= */
.search-bar {
  position: relative;
  margin-bottom: 20px;
}
.search-bar input {
  width: 100%;
  padding: 14px 20px 14px 48px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 50px;
  color: var(--text);
  font-family: var(--font-display);
  font-size: 14px;
  outline: none;
  transition: all .3s;
}
.search-bar input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(0,210,255,0.1);
}
.search-bar input::placeholder { color: var(--dim); }
.search-icon {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--dim);
  font-size: 16px;
}
.search-results {
  position: absolute;
  top: calc(100% + 8px);
  left: 0; right: 0;
  background: rgba(3,3,8,0.95);
  border: 1px solid var(--border);
  border-radius: 16px;
  backdrop-filter: blur(20px);
  padding: 8px;
  z-index: 200;
  display: none;
  max-height: 300px;
  overflow-y: auto;
}
.search-results.open { display: block; animation: fadeIn .2s ease; }
.search-result-item {
  padding: 10px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 13px;
  transition: background .2s;
  display: flex; align-items: center; gap: 10px;
}
.search-result-item:hover { background: var(--surface2); }

/* ======= NOTIFICATION ======= */
#notif-container {
  position: fixed;
  top: 80px; right: 20px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
}
.notif {
  padding: 12px 18px;
  background: rgba(3,3,8,0.95);
  border: 1px solid var(--accent);
  border-radius: 12px;
  backdrop-filter: blur(20px);
  font-size: 13px;
  max-width: 260px;
  animation: notifIn .4s cubic-bezier(.34,1.56,.64,1);
  pointer-events: all;
  box-shadow: 0 8px 24px rgba(0,210,255,0.15);
}
@keyframes notifIn {
  from { opacity:0; transform:translateX(40px) scale(.9); }
  to { opacity:1; transform:translateX(0) scale(1); }
}
@keyframes notifOut {
  to { opacity:0; transform:translateX(40px) scale(.9); }
}
.notif-title { font-weight: 700; color: var(--accent); font-size: 11px; letter-spacing: 1px; margin-bottom: 3px; }

/* ======= CHATBOX ======= */
#chatbox-btn {
  position: fixed;
  bottom: 78px; right: 20px;
  width: 52px; height: 52px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  font-size: 20px;
  z-index: 200;
  box-shadow: 0 4px 20px rgba(0,210,255,0.4);
  transition: all .3s cubic-bezier(.34,1.56,.64,1);
  border: none;
}
#chatbox-btn:hover { transform: scale(1.12) rotate(10deg); box-shadow: 0 8px 30px rgba(0,210,255,0.6); }
#chatbox-btn.open { transform: rotate(90deg) scale(.9); }

#chatbox {
  position: fixed;
  bottom: 142px; right: 20px;
  width: 320px;
  height: 420px;
  background: rgba(5,5,15,0.95);
  border: 1px solid var(--border);
  border-radius: 22px;
  backdrop-filter: blur(24px);
  display: flex;
  flex-direction: column;
  z-index: 199;
  box-shadow: 0 20px 60px rgba(0,0,0,.6);
  transform-origin: bottom right;
  transform: scale(0) translateY(20px);
  opacity: 0;
  transition: all .4s cubic-bezier(.34,1.56,.64,1);
  overflow: hidden;
}
#chatbox.open { transform: scale(1) translateY(0); opacity: 1; }

#chat-header {
  padding: 14px 18px;
  background: rgba(0,210,255,0.05);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.chat-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}
.chat-name { font-weight: 700; font-size: 14px; flex: 1; }
.chat-status { font-size: 11px; color: #55ff88; font-family: var(--font-mono); }
.chat-close {
  background: none; border: none; color: var(--dim);
  font-size: 18px; cursor: pointer; transition: color .2s;
}
.chat-close:hover { color: var(--text); }

#chat-body {
  flex: 1;
  padding: 14px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
#chat-body::-webkit-scrollbar { width: 4px; }
#chat-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.msg {
  max-width: 82%;
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 13px;
  line-height: 1.4;
  animation: msgIn .3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes msgIn {
  from { opacity:0; transform:scale(.85) translateY(8px); }
  to { opacity:1; transform:scale(1) translateY(0); }
}
.me {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}
.ai {
  background: var(--surface2);
  border: 1px solid var(--border);
  align-self: flex-start;
  border-bottom-left-radius: 4px;
}
.typing { display: flex; gap: 4px; align-items: center; padding: 12px 14px; }
.typing span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--dim);
  animation: typingDot 1.2s ease infinite;
}
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes typingDot {
  0%,80%,100% { transform:scale(.8); opacity:.4; }
  40% { transform:scale(1.2); opacity:1; }
}

#chat-input-area {
  padding: 12px 14px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
  align-items: center;
}
#msg {
  flex: 1;
  padding: 10px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 50px;
  color: var(--text);
  font-family: var(--font-display);
  font-size: 13px;
  outline: none;
  transition: border-color .2s;
}
#msg:focus { border-color: var(--accent); }
#msg::placeholder { color: var(--dim); }
.send-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  transition: all .25s;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.send-btn:hover { transform: scale(1.1) rotate(10deg); }

/* ======= PROGRESS BAR ======= */
#progress-bar {
  position: fixed;
  top: 0; left: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
  z-index: 1000;
  transition: width .2s ease;
}

/* ======= REVEAL ANIMATION ======= */
.reveal {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity .6s ease, transform .6s cubic-bezier(.16,1,.3,1);
}
.reveal.shown { opacity: 1; transform: translateY(0); }

/* ======= FADE IN ======= */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; } to { opacity: 1; }
}

/* ======= MOBILE ======= */
@media (max-width: 640px) {
  header { padding: 10px 16px; border-radius: 16px; margin: 8px; }
  nav { display: none; }
  .hero-title { font-size: 2.5rem; }
  .dock { transform: translateX(-50%) scale(.88); bottom: 14px; }
  .stats-bar { flex-wrap: wrap; }
  #chatbox { width: calc(100vw - 40px); right: 20px; }
}

/* ======= SCROLLBAR ======= */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<!-- Progress bar -->
<div id="progress-bar" style="width:0%"></div>

<!-- BG Canvas -->
<canvas id="bg-canvas"></canvas>

<!-- Notifications -->
<div id="notif-container"></div>

<!-- HEADER -->
<header>
  <div class="brand">ZESKA <span id="version-tag">v2.0</span></div>
  <nav id="nav"></nav>
  <div class="header-right">
    <div class="icon-btn" id="search-toggle" title="Search">🔍</div>

    <div class="icon-btn" id="theme-btn" title="Toggle Theme">◐</div>

</header>

<!-- MAIN -->
<div class="wrap">

  <!-- HERO -->
  <div class="hero">
    <h1 class="hero-title">
      <span class="line1">Welcome to</span>

  <!-- STATS -->

  <!-- SEARCH -->

  <!-- TERMINAL -->

    <div class="section-header">

        <div class="t-dot y"></div>

      </div>
      <div class="terminal-body" id="terminal-body">
        <div class="t-line"><span class="output">ZESKA OS 2.0 ready</span></div>

  <!-- QUICK ACCESS -->
  <div class="reveal">

      <div class="section-line"></div>
      <div class="section-badge" id="quick-count"></div>
    </div>

  <!-- SHORTCUTS -->
  <div class="reveal">
    <div class="section-header">
      <div class="section-title">Shortcuts</div>
      <div class="section-line"></div>
      <div class="section-badge" id="shortcut-count"></div>
    </div>
    <div class="grid" id="shortcuts"></div>
  </div>

  <!-- PORTFOLIO -->
  <div class="reveal">
    <div class="section-header">

      <div class="section-line"></div>
      <div class="section-badge">2025</div>
    </div>
    <div class="grid grid-3" id="portfolio"></div>
  </div>

  <!-- DIRECTORY -->
  <div class="reveal">
    <div class="section-header">

      <div class="section-line"></div>
      <div class="section-badge" id="dir-count"></div>
    </div>
    <div class="grid" id="directory"></div>
  </div>

  <!-- TEAM -->
  <div class="reveal">
    <div class="section-header">
      <div class="section-title">Team</div>
      <div class="section-line"></div>
      <div class="section-badge" id="team-count"></div>
    </div>
    <div class="grid" id="team"></div>
  </div>

  <!-- CONTACT -->
  <div class="reveal" style="margin-bottom: 120px;">
    <div class="section-header">
      <div class="section-title">Contact</div>
      <div class="section-line"></div>

</div>

<!-- DOCK -->

<!-- CHATBOX BUTTON -->
<button id="chatbox-btn">💬</button>

<!-- CHATBOX -->
<div id="chatbox">
  <div id="chat-header">
    <div class="chat-avatar">⚡</div>
    <div>
      <div class="chat-name">ZESKA AI</div>

</div>

<script>

  ],

  directory: ["intex.html","1.html","11.html","attendance.html","billing.html","certificate.html","portal.html","stock.html","main.py"],

  team: [
    { name: "Sibi", role: "Founder" },
    { name: "Sibi", role: "Engineer" },

    "ZESKA confirms: signal received loud and clear 📡"
  ]
};


/* =========================================
       BG PARTICLE CANVAS
========================================= */
(function() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [], mouse = { x: 0, y: 0 };

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for (let i = 0; i < 80; i++) {
    particles.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      vx: (Math.random() - .5) * .4,
      vy: (Math.random() - .5) * .4,
      size: Math.random() * 1.5 + .5,
      opacity: Math.random() * .5 + .1
    });
  }

  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // connect nearby particles
    particles.forEach((p, i) => {
      particles.slice(i + 1).forEach(q => {
        const d = Math.hypot(p.x - q.x, p.y - q.y);
        if (d < 120) {
          ctx.beginPath();
          ctx.strokeStyle = `rgba(0,210,255,${0.04 * (1 - d/120)})`;
          ctx.lineWidth = .8;
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.stroke();
        }
      });

      // connect to mouse
      const dm = Math.hypot(p.x - mouse.x, p.y - mouse.y);
      if (dm < 180) {
        ctx.beginPath();
        ctx.strokeStyle = `rgba(0,210,255,${0.12 * (1 - dm/180)})`;
        ctx.lineWidth = 1;
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(mouse.x, mouse.y);
        ctx.stroke();
      }

      // draw particle
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0,210,255,${p.opacity})`;
      ctx.fill();

      // move
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
    });

    requestAnimationFrame(draw);
  }
  draw();
})();


/* =========================================
       TYPING EFFECT
========================================= */
(function() {
  const words = ["ZESKA OS", "The Future", "Innovation", "ZESKA 2.0"];
  let wi = 0, ci = 0, deleting = false;
  const el = document.getElementById('typed-text');

  function type() {
    const word = words[wi];
    if (!deleting) {
      el.textContent = word.slice(0, ++ci);
      if (ci === word.length) { deleting = true; setTimeout(type, 1800); return; }
    } else {
      el.textContent = word.slice(0, --ci);
      if (ci === 0) { deleting = false; wi = (wi + 1) % words.length; }
    }
    setTimeout(type, deleting ? 60 : 90);
  }
  type();
})();


/* =========================================
       TERMINAL ANIMATION
========================================= */
(function() {
  const lines = [
    { prompt: "zeska@os", cmd: " ~ boot --system", delay: 400 },
    { output: "✓ Loading kernel modules...", delay: 900 },
    { output: "✓ Network connected (127ms)", delay: 1400 },
    { output: "✓ Dashboard initialized", delay: 1900 },
    { prompt: "zeska@os", cmd: " ~ status", delay: 2400 },
    { output: "✓ All systems operational", delay: 2900 },
    { prompt: "zeska@os", cmd: " ~ _", delay: 3300 }
  ];

  const body = document.getElementById('terminal-body');
  body.innerHTML = '';

  lines.forEach(l => {
    setTimeout(() => {
      const div = document.createElement('div');
      div.className = 't-line';
      if (l.prompt) {
        div.innerHTML = `<span class="prompt">${l.prompt}</span><span class="cmd">${l.cmd}</span>`;
      } else {
        div.innerHTML = `<span class="output">${l.output}</span>`;
      }
      body.appendChild(div);
      body.scrollTop = body.scrollHeight;
    }, l.delay);
  });
})();


/* =========================================
       RENDER
========================================= */
function openItem(link) { if (link) window.open(link, '_blank'); }

function render() {
  // Nav
  document.getElementById('nav').innerHTML = DATA.nav.map(n =>
    `<a href="#">${n}</a>`).join('');

  // Stats
  document.getElementById('stats-bar').innerHTML = DATA.stats.map(s =>
    `<div class="stat"><div class="stat-num counter" data-target="${s.num}">${s.num}</div><div class="stat-label">${s.label}</div></div>`
  ).join('');

  // Quick
  const qa = DATA.quickAccess;
  document.getElementById('quick-count').textContent = qa.length;
  document.getElementById('quick').innerHTML = qa.map(i =>
    `<div class="item" onclick="notify('Opening ${i.name}')"><span class="item-icon">${i.icon}</span><span>${i.name}</span></div>`
  ).join('');

  // Shortcuts
  const sc = DATA.shortcuts;
  document.getElementById('shortcut-count').textContent = sc.length;
  document.getElementById('shortcuts').innerHTML = sc.map(i =>
    `<div class="item ${i.glow ? 'glow' : ''}" onclick="openItem('${i.link}')">
      <span class="item-icon">${i.icon}</span><span>${i.name}</span>
    </div>`
  ).join('');

  // Portfolio
  document.getElementById('portfolio').innerHTML = DATA.portfolio.map(p =>
    `<div class="port-card" onclick="openItem('${p.link}')">
      <img src="${p.img}" loading="lazy" alt="${p.title}">
      <div class="port-overlay">
        <div class="port-tag">${p.tag}</div>
        <div class="port-title">${p.title}</div>
        <div class="port-desc">${p.desc}</div>
      </div>
      <div class="port-arrow">↗</div>
    </div>`
  ).join('');

  // Directory
  const dir = DATA.directory;
  document.getElementById('dir-count').textContent = dir.length;
  const icons = { '.html': '🌐', '.py': '🐍', '.js': '⚡', '.css': '🎨' };
  document.getElementById('directory').innerHTML = dir.map(f => {
    const ext = f.slice(f.lastIndexOf('.'));
    const icon = icons[ext] || '📄';
    return `<div class="item" onclick="openItem('${f}')" title="${f}">
      <span class="item-icon">${icon}</span>
      <span style="font-family:var(--font-mono);font-size:11px">${f}</span>
    </div>`;
  }).join('');

  // Team
  const tm = DATA.team;
  document.getElementById('team-count').textContent = tm.length;
  document.getElementById('team').innerHTML = tm.map((t, i) => {
    const colors = ['#00d2ff','#7b2fff','#ff2f8e','#00d2ff','#ffbd2e','#28ca41','#ff5f57'];
    return `<div class="team-card">
      <div class="avatar" style="background:linear-gradient(135deg,${colors[i]},${colors[(i+2)%colors.length]})">${t.name[0]}</div>
      <div class="team-name">${t.name}</div>
      <div class="team-role">${t.role}</div>
    </div>`;
  }).join('');

  // Contact
  document.getElementById('contact').innerHTML = DATA.contact.map(c =>
    `<a class="contact-item" href="${c.href}">
      <div class="contact-icon">${c.icon}</div>
      <div>
        <div class="contact-label">${c.label}</div>
        <div class="contact-value">${c.value}</div>
      </div>
    </a>`
  ).join('');

  // Dock
  document.getElementById('dock').innerHTML = DATA.shortcuts.map(i =>
    `<div class="dock-item ${i.glow ? 'glow-dock' : ''}" onclick="openItem('${i.link}')">${i.icon} ${i.name}</div>`
  ).join('');
}


/* =========================================
       SCROLL PROGRESS BAR
========================================= */
window.addEventListener('scroll', () => {
  const pct = window.scrollY / (document.body.scrollHeight - window.innerHeight) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
  revealAll();
});


/* =========================================
       SCROLL REVEAL
========================================= */
function revealAll() {
  document.querySelectorAll('.reveal:not(.shown)').forEach(el => {
    if (el.getBoundingClientRect().top < window.innerHeight - 60) {
      el.classList.add('shown');
    }
  });
}
setTimeout(revealAll, 100);


/* =========================================
       NOTIFICATIONS
========================================= */
function notify(msg, title = 'ZESKA') {
  const c = document.getElementById('notif-container');
  const n = document.createElement('div');
  n.className = 'notif';
  n.innerHTML = `<div class="notif-title">⚡ ${title}</div>${msg}`;
  c.appendChild(n);
  setTimeout(() => {
    n.style.animation = 'notifOut .3s forwards';
    setTimeout(() => n.remove(), 300);
  }, 2800);
}

document.getElementById('notif-btn').onclick = () => notify('All systems running smoothly.', 'STATUS');


/* =========================================
       SEARCH
========================================= */
const allItems = [
  ...DATA.shortcuts.map(s => ({ label: s.name, icon: s.icon, link: s.link })),
  ...DATA.quickAccess.map(q => ({ label: q.name, icon: q.icon, link: '' })),
  ...DATA.directory.map(d => ({ label: d, icon: '📄', link: d })),
  ...DATA.team.map(t => ({ label: `${t.name} – ${t.role}`, icon: '👤', link: '' }))
];

const searchInput = document.getElementById('global-search');
const searchResults = document.getElementById('search-results');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) { searchResults.classList.remove('open'); return; }
  const matches = allItems.filter(i => i.label.toLowerCase().includes(q)).slice(0, 8);
  if (!matches.length) { searchResults.classList.remove('open'); return; }
  searchResults.innerHTML = matches.map(m =>
    `<div class="search-result-item" onclick="openItem('${m.link}')">
      <span>${m.icon}</span><span>${m.label}</span>
    </div>`
  ).join('');
  searchResults.classList.add('open');
});

document.addEventListener('click', e => {
  if (!e.target.closest('.search-bar')) searchResults.classList.remove('open');
});

document.getElementById('search-toggle').onclick = () => {
  searchInput.focus();
  searchInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
};


/* =========================================
       THEME
========================================= */
if (localStorage.theme === 'light') document.body.classList.add('light');
document.getElementById('theme-btn').onclick = () => {
  document.body.classList.toggle('light');
  localStorage.theme = document.body.classList.contains('light') ? 'light' : 'dark';
  notify('Theme switched', 'DISPLAY');
};


/* =========================================
       CHATBOX
========================================= */
function toggleChat() {
  const box = document.getElementById('chatbox');
  const btn = document.getElementById('chatbox-btn');
  box.classList.toggle('open');
  btn.classList.toggle('open');
  if (box.classList.contains('open') && !document.querySelector('#chat-body .msg')) {
    setTimeout(() => addAiMsg("Hey! I'm ZESKA AI 👋 How can I help you today?"), 400);
  }
}

document.getElementById('chatbox-btn').onclick = toggleChat;

function addAiMsg(text) {
  const body = document.getElementById('chat-body');
  const typing = document.createElement('div');
  typing.className = 'msg ai typing';
  typing.innerHTML = '<span></span><span></span><span></span>';
  body.appendChild(typing);
  body.scrollTop = body.scrollHeight;
  setTimeout(() => {
    typing.remove();
    const msg = document.createElement('div');
    msg.className = 'msg ai';
    msg.textContent = text;
    body.appendChild(msg);
    body.scrollTop = body.scrollHeight;
  }, 900);
}

function sendMsg() {
  const input = document.getElementById('msg');
  const text = input.value.trim();
  if (!text) return;

  const body = document.getElementById('chat-body');
  const userMsg = document.createElement('div');
  userMsg.className = 'msg me';
  userMsg.textContent = text;
  body.appendChild(userMsg);
  input.value = '';
  body.scrollTop = body.scrollHeight;

  const reply = DATA.aiReplies[Math.floor(Math.random() * DATA.aiReplies.length)];
  addAiMsg(reply);
}

document.getElementById('msg').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendMsg();
});


/* =========================================
       KEYBOARD SHORTCUT
========================================= */
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    searchInput.focus();
    searchInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
    notify('Search activated (Ctrl+K)', 'SHORTCUT');
  }
  if (e.key === 'Escape') {
    searchResults.classList.remove('open');
    document.getElementById('chatbox').classList.remove('open');
    document.getElementById('chatbox-btn').classList.remove('open');
  }
});


/* =========================================
       WELCOME NOTIFICATION
========================================= */
setTimeout(() => notify('Welcome to ZESKA OS 2.0 🚀', 'SYSTEM'), 1200);
setTimeout(() => notify('Press Ctrl+K to search', 'TIP'), 2600);


/* =========================================
       INIT
========================================= */
render();
</script>
</body>
